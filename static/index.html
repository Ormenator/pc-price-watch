<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#17131d" />
  <title>PC Hardware Watch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v=3" />
  <link rel="icon" href="/logo.svg" type="image/svg+xml" />
  <script>
    try {
      const saved = localStorage.getItem("ppw-theme");
      const light = saved === "light" || (!saved && matchMedia("(prefers-color-scheme: light)").matches);
      document.documentElement.setAttribute("data-theme", light ? "light" : "dark");
    } catch {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  </script>
</head>
<body>
  <div class="blob blob-a" aria-hidden="true"></div>
  <div class="blob blob-b" aria-hidden="true"></div>
  <div class="cursor-glow" aria-hidden="true"></div>
  <div id="app" aria-live="polite">
    <main><p class="muted">Loading PC Hardware Watch…</p></main>
  </div>
  <script src="/cloudflare-app.js" defer></script>
</body>
</html>
