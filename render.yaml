services:
  - type: web
    name: pc-price-watch
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: pc-price-watch-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PC_PRICE_WATCH_DB
        value: /var/data/watch.db
      - key: APP_USERNAME
        value: admin
      - key: APP_PASSWORD
        generateValue: true